[package]
name = "alwychat"
description = "AlwyChat — a Matrix client"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# `_lib` suffix avoids a bin/lib name clash on Windows (cargo#8519).
name = "alwychat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
alwy-core.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-deep-link = "2"
# App lock: fingerprint / face on Android and iOS (a stub elsewhere).
tauri-plugin-biometric = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
percent-encoding = "2"
base64 = "0.22"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Asks D-Bus whether a tray host exists (stock GNOME has none).
# Desktop apps update themselves (signed builds from GitHub releases).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
# "Open when the computer starts" (Windows Run key, Linux autostart entry, macOS login item).
tauri-plugin-autostart = "2"
# A second launch shows the running app instead of a second client on the same store.
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"
libc = "0.2"
# Calls: WebKitGTK has no WebRTC, so LiveKit runs natively there (crates/alwy-call).
alwy-call = { path = "../../crates/alwy-call" }
# Microphone / camera permission answers in the main webview (see `enable_media_capture`).
# Same version as wry's.
webkit2gtk = "2.0.2"

[target.'cfg(target_os = "android")'.dependencies]
# Rust logs in logcat (stdout goes nowhere on Android).
paranoid-android = "0.2"
# HTTPS certificate checks use Android's trust store through JNI: needs a one-time init.
rustls-platform-verifier = "0.7"
jni = { version = "0.22", default-features = false }
ndk-context = "0.1"

[lints]
workspace = true
