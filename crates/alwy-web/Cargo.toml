[package]
name = "alwy-web"
description = "AlwyChat in a browser: alwy-core compiled to WebAssembly, behind the same commands as the Tauri app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
alwy-core.workspace = true
# The copied Tauri commands decode base64 (voice messages, wallpapers).
base64 = "0.22"
futures-util.workspace = true
js-sys = "0.3"
send_wrapper = "0.6"
serde.workspace = true
serde_json.workspace = true
serde-wasm-bindgen = "0.6"
tracing.workspace = true
url.workspace = true
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Location", "console"] }

[build-dependencies]
quote = "1"
syn = { version = "2", features = ["full"] }

[lints]
workspace = true
