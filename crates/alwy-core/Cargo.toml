[package]
name = "alwy-core"
description = "AlwyChat Matrix client core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ammonia.workspace = true
image.workspace = true
mime.workspace = true
ogg = "0.9"
# lk-jwt-service (LiveKit tokens for calls); TLS comes from matrix-sdk's reqwest features.
reqwest = { version = "0.13", default-features = false, features = ["json"] }
matrix-sdk.workspace = true
matrix-sdk-ui.workspace = true
eyeball-im.workspace = true
futures-util.workspace = true
rand.workspace = true
# App lock PIN hash.
pbkdf2 = "0.13"
sha2 = "0.11"
# CollectStrategy for custom to-device messages (not re-exported by matrix-sdk).
matrix-sdk-base = { version = "0.19", default-features = false }
base64 = "0.22"
# Message search (SQLite FTS5); in a browser through sqlite-wasm-rs.
rusqlite = "0.40"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true
rqrr = "0.11.0"

# Desktop: session tokens and the store passphrase live in the OS keychain (Secret Service on
# Linux). Android keeps them in the app's private storage (no backups, not debuggable in release).
[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos"))'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust", "windows-native", "apple-native"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
matrix-sdk = { workspace = true, features = ["bundled-sqlite", "local-server"] }
tokio = { workspace = true, features = ["rt-multi-thread", "fs"] }

[target.'cfg(target_family = "wasm")'.dependencies]
matrix-sdk = { workspace = true, features = ["indexeddb", "js"] }
matrix-sdk-ui = { workspace = true, features = ["js"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
wasm-bindgen = "0.2"
# Sealing the web session (src/web/sealed.js is async).
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Storage"] }

[lints]
workspace = true
