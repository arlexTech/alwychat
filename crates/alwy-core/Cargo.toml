[package]
name = "alwy-core"
description = "AlwyChat Matrix client core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ammonia.workspace = true
image.workspace = true
mime.workspace = true
ogg = "0.9"
# lk-jwt-service (LiveKit tokens for calls); TLS comes from matrix-sdk's reqwest features.
reqwest = { version = "0.13", default-features = false, features = ["json"] }
matrix-sdk.workspace = true
matrix-sdk-ui.workspace = true
eyeball-im.workspace = true
futures-util.workspace = true
rand.workspace = true
# App lock PIN hash.
pbkdf2 = "0.13"
sha2 = "0.11"
# Message search (SQLite FTS5). Same version as matrix-sdk-sqlite, so it shares its bundled SQLite.
rusqlite = "0.40"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true

# Desktop: session tokens and the store passphrase live in the OS keychain (Secret Service on
# Linux). Android keeps them in the app's private storage (no backups, not debuggable in release).
[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos"))'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust", "windows-native", "apple-native"] }

[lints]
workspace = true
