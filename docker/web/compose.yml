# AlwyChat web version, behind the reverse proxy you already have (Caddy, nginx, Traefik…).
# 1. docker compose up -d
# 2. In your reverse proxy, send https://chat.example.org to http://127.0.0.1:8080
# Update later: docker compose pull && docker compose up -d
services:
  alwychat:
    image: ghcr.io/arlextech/alwychat-web:beta # :latest once the first stable release is out
    container_name: alwychat
    restart: unless-stopped
    ports:
      # 127.0.0.1: only your reverse proxy on this machine reaches it, not the whole network.
      - "127.0.0.1:8080:80"
    # Optional: the Matrix server the sign-in screen suggests (default: matrix.org).
    # environment:
    #   DEFAULT_MATRIX_SERVER: example.org
