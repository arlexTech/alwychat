# Local test on this PC: https://chat.example.org with a certificate from Caddy's own local CA
# (the browser warns once). Serves the folder built by `pnpm build:web`, no image build needed.
#   docker compose -f docker/web/compose.local.yml up -d
services:
  alwychat-web:
    image: caddy:2-alpine
    ports:
      - "127.0.0.1:443:443"
      - "127.0.0.1:80:80"
    environment:
      ALWY_ADDRESS: chat.example.org
      ALWY_TLS: tls internal
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../app/build-web:/srv:ro
      - caddy-data:/data
volumes:
  caddy-data:
