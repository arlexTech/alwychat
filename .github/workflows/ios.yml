# Unsigned iPhone build (no paid Apple account yet): an .ipa to install with SideStore or
# AltStore, which re-sign it with a free Apple ID. The Xcode project (gen/apple) is generated
# here because `tauri ios init` only runs on macOS.

name: iOS

on:
  push:
    branches: [main, ios-ci]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2

      - name: Install
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Generate the Xcode project
        working-directory: app
        run: |
          pnpm tauri ios init --ci
          # The app icon from the logo, into the generated project's asset catalog.
          pnpm tauri icon src-tauri/icons/logo.svg
          # No signing: SideStore/AltStore sign the app on the phone's side. Tauri regenerates the
          # Xcode project from project.yml, so the settings go there (and in the current project).
          cd src-tauri/gen/apple
          yq -i '(.targets[] | select(has("settings"))).settings.base += {"CODE_SIGNING_ALLOWED": "NO", "CODE_SIGNING_REQUIRED": "NO", "CODE_SIGN_IDENTITY": "", "CODE_SIGN_STYLE": "Manual", "DEVELOPMENT_TEAM": ""}' project.yml
          find . -name project.pbxproj -exec sed -i '' \
            -e 's/buildSettings = {/buildSettings = { CODE_SIGNING_ALLOWED = NO; CODE_SIGNING_REQUIRED = NO; CODE_SIGN_IDENTITY = ""; /' {} +
          echo "::notice title=signing settings::$(yq '.targets[].settings.base | with_entries(select(.key | test("SIGN|TEAM")))' -o json project.yml | tr -d '\n')"
          cd ../../..
          plutil -p src-tauri/gen/apple/*_iOS/Info.plist || true

      - name: Build
        working-directory: app
        # The archive is what we need; exporting a signed .ipa afterwards is expected to fail.
        shell: bash
        run: |
          set -o pipefail
          if ! pnpm tauri ios build --target aarch64 2>&1 | tee "$RUNNER_TEMP/build.log"; then
            # Logs need a GitHub sign-in to read; annotations don't: show the end there.
            tail -n 45 "$RUNNER_TEMP/build.log" | sed 's/\x1b\[[0-9;]*m//g' | cut -c1-220 \
              | awk 'BEGIN{ORS="%0A"} {print}' | sed 's/^/::warning title=ios build tail::/'
            echo
          fi

      - name: Package the .ipa
        run: |
          roots="app/src-tauri/gen/apple $HOME/Library/Developer/Xcode"
          app=$(find $roots -path '*.xcarchive/Products/Applications/*.app' -type d -prune 2>/dev/null | head -1)
          [ -z "$app" ] && app=$(find $roots -path '*iphoneos*' -name '*.app' -type d -prune 2>/dev/null | head -1)
          if [ -z "$app" ]; then
            echo "::error title=no .app::$(find $roots \( -name '*.app' -o -name '*.xcarchive' -o -name '*.ipa' \) 2>/dev/null | head -20 | tr '\n' ' ')"
            exit 1
          fi
          echo "app: $app"
          mkdir -p ipa/Payload out
          cp -R "$app" ipa/Payload/
          (cd ipa && zip -qr ../out/AlwyChat-ios-unsigned.ipa Payload)
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: alwychat-iOS
          path: out/*
      - name: Keep the generated Xcode project
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gen-apple
          path: |
            app/src-tauri/gen/apple
            !app/src-tauri/gen/apple/build
