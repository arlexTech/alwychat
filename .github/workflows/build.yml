# Builds AlwyChat for every platform. A pushed `v*` tag also drafts a GitHub release with the
# files under the stable names the README links to (releases/latest/download/<name>).
# Every push to the `beta` branch replaces the rolling `beta` pre-release (the README's
# "Newest" column, releases/download/beta/<name>) with the new build. Both channels publish a
# latest.json the apps update themselves from (secrets TAURI_SIGNING_PRIVATE_KEY[_PASSWORD]
# sign the desktop updates; Android checks its own signing key).
#
# Optional repository secrets:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS
#       signed release APK (without them: a debug APK, fine for testing, not for a release)
#   GOOGLE_SERVICES_JSON_BASE64
#       Firebase config for Android push notifications

name: Build

on:
  push:
    branches: [main, beta]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      # Releases (v* tags) and the beta branch get a version and their update feed; the apps
      # then update themselves from that channel (latest.json, see .github/scripts).
      - name: Version and update channel
        shell: bash
        run: |
          repo="https://github.com/${{ github.repository }}/releases"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"; feed="$repo/latest/download/latest.json"
          elif [[ "$GITHUB_REF" == refs/heads/beta ]]; then
            version="0.1.${{ github.run_number }}"; feed="$repo/download/beta/latest.json"
          else
            exit 0
          fi
          py=$(command -v python3 || command -v python)
          "$py" - "$version" "$feed" <<'PY'
          import json, sys
          version, feed = sys.argv[1], sys.argv[2]
          for path, change in [
              ("app/src-tauri/tauri.conf.json", lambda c: c.update(version=version) or c["plugins"]["updater"].update(endpoints=[feed])),
              ("app/package.json", lambda c: c.update(version=version)),
          ]:
              config = json.load(open(path, encoding="utf-8"))
              change(config)
              json.dump(config, open(path, "w", encoding="utf-8"), indent=2)
          PY
          echo "ALWY_UPDATE_FEED=$feed" >> "$GITHUB_ENV"
          echo "version $version, updates from $feed"

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev rpm
          # Native calls (crates/alwy-call): LiveKit's prebuilt WebRTC needs clang 21+ (the
          # runner has 14) and V4L2 headers for the camera.
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s 21
          sudo apt-get install -y libv4l-dev
          echo "CC=clang-21" >> "$GITHUB_ENV"
          echo "CXX=clang++-21" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2

      - name: Install
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: app
        shell: bash
        env:
          # Signs the update files (.sig) the apps check before installing an update.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Logs need a GitHub sign-in: the end of a failed build is shown as annotations too.
          show_tail() {
            tail -n 40 "$RUNNER_TEMP/build.log" | sed 's/\x1b\[[0-9;]*m//g' | cut -c1-220 \
              | awk 'BEGIN{ORS="%0A"} {print}' | sed "s/^/::warning title=$1 build tail::/"
            echo
          }
          updater=()
          if [ "$HAS_UPDATER_KEY" = true ]; then updater=(--config '{"bundle":{"createUpdaterArtifacts":true}}'); fi
          if ! pnpm tauri build ${{ matrix.args }} "${updater[@]}" 2>&1 | tee "$RUNNER_TEMP/build.log"; then
            show_tail "${{ matrix.name }}"
            exit 1
          fi

      - name: Collect
        shell: bash
        run: |
          mkdir out
          b=target/release/bundle
          case "${{ runner.os }}" in
            Linux)
              put() { cp $1 out/$2; cp $1.sig out/$2.sig 2>/dev/null || true; }
              put "$(ls $b/appimage/*.AppImage)" AlwyChat-linux-x86_64.AppImage
              put "$(ls $b/deb/*.deb)" AlwyChat-linux-amd64.deb
              put "$(ls $b/rpm/*.rpm)" AlwyChat-linux-x86_64.rpm ;;
            Windows)
              put() { cp "$1" out/$2; cp "$1.sig" out/$2.sig 2>/dev/null || true; }
              put "$(ls $b/nsis/*-setup.exe)" AlwyChat-windows-x64-setup.exe
              put "$(ls $b/msi/*.msi)" AlwyChat-windows-x64.msi ;;
            macOS)
              m=target/universal-apple-darwin/release/bundle
              cp $m/dmg/*.dmg out/AlwyChat-macos.dmg
              if ls $m/macos/*.app.tar.gz >/dev/null 2>&1; then
                cp $m/macos/*.app.tar.gz out/AlwyChat-macos.app.tar.gz
                cp $m/macos/*.app.tar.gz.sig out/AlwyChat-macos.app.tar.gz.sig
              fi ;;
          esac
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: alwychat-${{ runner.os }}
          path: out/*

  android:
    name: Android
    runs-on: ubuntu-22.04
    env:
      NDK_VERSION: 29.0.14206865
      # Secrets can't be tested in `if:` directly.
      HAS_FIREBASE: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 != '' }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      # Releases (v* tags) and the beta branch get a version and their update feed; the apps
      # then update themselves from that channel (latest.json, see .github/scripts).
      - name: Version and update channel
        shell: bash
        run: |
          repo="https://github.com/${{ github.repository }}/releases"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"; feed="$repo/latest/download/latest.json"
          elif [[ "$GITHUB_REF" == refs/heads/beta ]]; then
            version="0.1.${{ github.run_number }}"; feed="$repo/download/beta/latest.json"
          else
            exit 0
          fi
          py=$(command -v python3 || command -v python)
          "$py" - "$version" "$feed" <<'PY'
          import json, sys
          version, feed = sys.argv[1], sys.argv[2]
          for path, change in [
              ("app/src-tauri/tauri.conf.json", lambda c: c.update(version=version) or c["plugins"]["updater"].update(endpoints=[feed])),
              ("app/package.json", lambda c: c.update(version=version)),
          ]:
              config = json.load(open(path, encoding="utf-8"))
              change(config)
              json.dump(config, open(path, "w", encoding="utf-8"), indent=2)
          PY
          echo "ALWY_UPDATE_FEED=$feed" >> "$GITHUB_ENV"
          echo "version $version, updates from $feed"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2

      - name: Firebase config
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        if: env.HAS_FIREBASE == 'true'
        run: echo "$GOOGLE_SERVICES" | base64 -d > app/src-tauri/gen/android/app/google-services.json
      - name: Signing key
        id: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\npassword=%s\nkeyAlias=%s\n' "$RUNNER_TEMP/release.jks" "$PASSWORD" "$ALIAS" \
            > app/src-tauri/gen/android/keystore.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Install
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: app
        run: |
          if [ "${{ steps.signing.outputs.signed }}" = true ]; then
            pnpm tauri android build --apk --target aarch64 armv7 x86_64
          else
            pnpm tauri android build --apk --debug --target aarch64 armv7 x86_64
          fi
      - name: Collect
        run: |
          mkdir out
          apk=$(find app/src-tauri/gen/android/app/build/outputs/apk/universal -name '*.apk' | head -1)
          cp "$apk" out/AlwyChat-android.apk
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: alwychat-Android
          path: out/*

  web:
    name: Web
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      # Releases (v* tags) and the beta branch get a version and their update feed; the apps
      # then update themselves from that channel (latest.json, see .github/scripts).
      - name: Version and update channel
        shell: bash
        run: |
          repo="https://github.com/${{ github.repository }}/releases"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"; feed="$repo/latest/download/latest.json"
          elif [[ "$GITHUB_REF" == refs/heads/beta ]]; then
            version="0.1.${{ github.run_number }}"; feed="$repo/download/beta/latest.json"
          else
            exit 0
          fi
          py=$(command -v python3 || command -v python)
          "$py" - "$version" "$feed" <<'PY'
          import json, sys
          version, feed = sys.argv[1], sys.argv[2]
          for path, change in [
              ("app/src-tauri/tauri.conf.json", lambda c: c.update(version=version) or c["plugins"]["updater"].update(endpoints=[feed])),
              ("app/package.json", lambda c: c.update(version=version)),
          ]:
              config = json.load(open(path, encoding="utf-8"))
              change(config)
              json.dump(config, open(path, "w", encoding="utf-8"), indent=2)
          PY
          echo "ALWY_UPDATE_FEED=$feed" >> "$GITHUB_ENV"
          echo "version $version, updates from $feed"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: wasm-bindgen (same version as the crate)
        run: |
          version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
          if [ "$(wasm-bindgen --version 2>/dev/null)" != "wasm-bindgen $version" ]; then
            cargo install wasm-bindgen-cli --locked --version "$version"
          fi
      - name: Install
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: app
        run: |
          # Logs need a GitHub sign-in: the end of a failed build is shown as annotations too.
          show_tail() {
            tail -n 40 "$RUNNER_TEMP/build.log" | sed 's/\x1b\[[0-9;]*m//g' | cut -c1-220 \
              | awk 'BEGIN{ORS="%0A"} {print}' | sed "s/^/::warning title=$1 build tail::/"
            echo
          }
          if ! pnpm build:web 2>&1 | tee "$RUNNER_TEMP/build.log"; then
            show_tail web
            exit 1
          fi
      - name: Collect
        run: |
          mkdir out
          # Python's zip (the runner may have no zip command).
          python3 -c "import shutil; shutil.make_archive('out/AlwyChat-web', 'zip', 'app/build-web')"
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: alwychat-Web
          path: out/*

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Update manifest
        run: python3 .github/scripts/update-manifest.py out "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}" "${GITHUB_REF_NAME#v}" "AlwyChat ${{ github.ref_name }}"
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: out/*

  beta:
    name: Newest version (beta)
    if: github.ref == 'refs/heads/beta'
    needs: [desktop, android, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Update manifest
        run: python3 .github/scripts/update-manifest.py out "https://github.com/${{ github.repository }}/releases/download/beta" "0.1.${{ github.run_number }}" "Newest version, built from ${{ github.sha }}"
      # One rolling pre-release: the old one (and its tag) goes, the new one points at this commit.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete beta --cleanup-tag --yes || true
          gh release create beta out/* --prerelease --target "$GITHUB_SHA" \
            --title "Newest version (updates itself)" \
            --notes "Version 0.1.${{ github.run_number }}, built from \`${GITHUB_SHA::7}\` on $(date -u +'%Y-%m-%d %H:%M UTC'): every change as soon as it's made. Installed from here, AlwyChat updates itself to each new build."
